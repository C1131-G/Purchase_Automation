name: OpenAPI lint

on:
  pull_request:
    paths:
      - "hana-backend/**"
      - ".github/workflows/openapi-lint.yml"
  push:
    branches: [main, master]
    paths:
      - "hana-backend/**"
      - ".github/workflows/openapi-lint.yml"

jobs:
  hana-openapi:
    name: HANA OpenAPI contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # version comes from root package.json "packageManager" (pnpm@11.13.0)
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter hana-backend openapi:lint
