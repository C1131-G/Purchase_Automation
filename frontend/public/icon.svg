<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="inkBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#162a41" />
      <stop offset="55%" stop-color="#0f1e2e" />
      <stop offset="100%" stop-color="#0a1628" />
    </linearGradient>
    <linearGradient id="tealAccentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="50%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#0a544e" />
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="45%" r="40%">
      <stop offset="0%" stop-color="#0f766e" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#0f1e2e" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Base Squircle Background -->
  <rect width="512" height="512" rx="120" fill="url(#inkBgGrad)" />

  <!-- Radial Glow Behind Icon -->
  <circle cx="256" cy="235" r="160" fill="url(#centerGlow)" />

  <!-- Inner Glowing Accent Border -->
  <rect x="12" y="12" width="488" height="488" rx="108" fill="none" stroke="url(#tealAccentGrad)" stroke-width="5" stroke-opacity="0.5" />

  <!-- Primary White ERP Structure -->
  <path d="M156 360 V 224 L 256 152 L 356 224 V 360 Z" fill="none" stroke="#ffffff" stroke-width="26" stroke-linejoin="round" stroke-linecap="round" />
  <path d="M210 360 V 286 H 302 V 360" fill="none" stroke="#ffffff" stroke-width="24" stroke-linejoin="round" stroke-linecap="round" />

  <!-- Center Teal Accent Node -->
  <circle cx="256" cy="220" r="18" fill="url(#tealAccentGrad)" stroke="#ffffff" stroke-width="6" />
</svg>
